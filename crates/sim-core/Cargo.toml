[package]
name = "sim-core"
version = "0.1.0"
edition = "2021"
description = "Rust / WebAssembly copy of the pure simulation maths (the wave ocean first)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
