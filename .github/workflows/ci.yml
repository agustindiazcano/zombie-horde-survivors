name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:assets
      # The golden hash of the simulation, with the TypeScript and the Rust kernels: it must not change.
      - run: npm run check:sim-hash
      # The simulation's own maths: the TypeScript and the Rust copies must agree to the bit.
      - run: npm run check:dmath
      - run: npm run check:ocean-wasm
      - run: npm run check:kernels
